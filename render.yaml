services:
  - type: web
    name: side-quest-finder-api
    env: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: side-quest-finder-db
          property: connectionString
      - key: XC_ENABLE_SCHEDULER
        value: "1"
      - key: XC_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EVENTBRITE_TOKEN
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
      - key: XC_NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: side-quest-finder-db
    plan: starter
